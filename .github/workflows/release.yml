name: Release

# Runs when a version tag such as v0.5.0 is pushed.
# Checks that VERSION and CHANGELOG.md match the tag, then publishes a
# GitHub Release with the changelog entry and two downloadable zips.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check VERSION matches the tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILE="v$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG" != "$FILE" ]; then
            echo "::error::Tag $TAG does not match VERSION file ($FILE). Update VERSION before tagging."
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          python3 scripts/changelog_section.py "${GITHUB_REF_NAME}" > notes.md
          cat notes.md

      - name: Build zips
        run: |
          V="${GITHUB_REF_NAME}"
          git archive --format=zip --prefix="voicestudio-$V/" -o "voicestudio-$V.zip" HEAD
          git archive --format=zip --prefix="voicestudio-lite-$V/" -o "voicestudio-lite-$V.zip" HEAD:lite

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME}"
          PRE=""
          case "$V" in v0.*|*-*) PRE="--prerelease" ;; esac
          gh release create "$V" --title "Voice Studio $V" --notes-file notes.md $PRE \
            "voicestudio-$V.zip#Voice Studio (full, GPU) $V" \
            "voicestudio-lite-$V.zip#Voice Studio Lite (Piper, no GPU) $V"
